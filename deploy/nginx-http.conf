# Installed to /etc/nginx/sites-available/linkedclone by provision.sh BEFORE a
# certificate exists, so the site is reachable over plain http while DNS and TLS
# are being set up. `provision.sh --tls` replaces it with nginx.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAMES__;

    client_max_body_size 6M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias __APP_ROOT__/current/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Profile photos. Served straight off disk; always as the image type the
    # extension says, never sniffed into something runnable.
    location /media/ {
        alias __APP_ROOT__/shared/media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
    }

    location = /accounts/login/ {
        limit_req zone=linkedclone_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
