# Full HTTPS site. Installed to /etc/nginx/sites-available/linkedclone by
# `provision.sh --tls`, after the certificate has been issued. Placeholders
# (__DOMAIN__, __SERVER_NAMES__, __APP_ROOT__) are filled in by provision.sh.

# Requests for any other name (bots scanning IP addresses with made-up Host
# headers) are dropped here instead of reaching Django. Needs nginx 1.19.4+ for
# ssl_reject_handshake.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __SERVER_NAMES__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6M;

    location /static/ {
        alias __APP_ROOT__/current/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location /media/ {
        alias __APP_ROOT__/shared/media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
    }

    location = /accounts/login/ {
        limit_req zone=linkedclone_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
