{% extends "base.html" %}
{% block title %}Reset your password{% endblock %}
{% block content %}
<div class="card"><h1>Reset your password</h1><p class="muted">Enter your account email and we will send a link to choose a new password.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button>Send reset link</button></form></div>
{% endblock %}
