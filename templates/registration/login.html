{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card"><h1>Sign in</h1>
<form method="post">{% csrf_token %}{{ form.as_p }}<button>Sign in</button></form>
<p class="muted"><a href="{% url 'password_reset' %}">Forgot your password?</a> · <a href="{% url 'unlock_request' %}">Locked out?</a></p>
<p class="muted">New here? <a href="{% url 'signup' %}">Join now</a></p></div>
{% endblock %}
