{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="card"><h1>Choose a new password</h1>
{% if validlink == False %}<p>This reset link is invalid or has already been used. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>{% else %}<form method="post">{% csrf_token %}{{ form.as_p }}<button>Save new password</button></form>{% endif %}</div>
{% endblock %}
