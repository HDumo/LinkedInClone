{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card"><h1>Change password</h1>{% if required %}<p style="color:#cc1016"><strong>An administrator requires you to choose a new password before you continue.</strong></p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<button>Save new password</button></form></div>
{% endblock %}
