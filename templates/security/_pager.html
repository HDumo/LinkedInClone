{% if page.paginator.num_pages > 1 %}<p class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }}
{% if page.has_previous %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">‹ Newer</a>{% endif %}
{% if page.has_next %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Older ›</a>{% endif %}</p>{% endif %}
